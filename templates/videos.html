{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='videos.css') }}">

<header class="header">
    <h1>Jardines TV</h1>
</header>

<main>

    <!-- VIDEO PLAYER -->
      
<!-- VIDEO PLAYER -->
<section class="player-container">

    <div class="player">

        <!-- IMAGEN INICIAL -->
        <img
            id="playerPlaceholder"
            src="{{ url_for('static', filename='images/review8.jpg') }}"
            alt="Jardines TV"
            class="player-placeholder"
        >

        <!-- YOUTUBE -->
        <iframe
            id="youtubePlayer"
            src=""
            title="Jardines TV"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>

    <h2 id="videoTitle">
        Select a Video
    </h2>

</section>
    <!-- VIDEOS -->
    <section>

        <h2 class="section-title">
            Jardines TV Videos
        </h2>

        {% if videos %}

        <div class="videos">

            {% for video in videos %}

            <article class="video-card"
                     onclick="playVideo('{{ video.id }}', '{{ video.title|e }}')">

                <img
                    src="{{ video.thumbnail }}"
                    alt="{{ video.title|e }}"
                    loading="lazy"
                >

                <h3>{{ video.title }}</h3>

            </article>

            {% endfor %}

        </div>

        {% else %}

        <p class="no-videos">
            No videos are available at this time.
        </p>

        {% endif %}

    </section>

</main>


 
<script>
function playVideo(videoId, title) {

    const player = document.getElementById("youtubePlayer");
    const placeholder = document.getElementById("playerPlaceholder");
    const videoTitle = document.getElementById("videoTitle");

    // Ocultar imagen inicial
    placeholder.style.display = "none";

    // Mostrar video
    player.style.display = "block";

    player.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&rel=0";

    // Cambiar título
    videoTitle.textContent = title;

    // Subir al reproductor
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>
 


{% endblock %}
